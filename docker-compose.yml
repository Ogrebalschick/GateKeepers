services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80" # основной порт; если 80 занят на хосте — замени на "8080:80"
    depends_on:
      - backend
      - ml-service
    restart: unless-stopped

  # Сборку backend и ml-service дополняет BE-019. Имена сервисов нужны nginx и depends_on.
  backend:
    build: ./backend

  ml-service:
    build: ./ml-service
