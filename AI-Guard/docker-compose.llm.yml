services:
  # The team Compose also defines llama with a host-specific build and executable mount.
  llama: !override
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    command:
      - "-m"
      - "/models/model.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${LLAMA_CONTEXT_SIZE:-2048}"
    volumes:
      - type: bind
        source: "${LLAMA_MODEL_PATH:?Set LLAMA_MODEL_PATH to a local GGUF model file}"
        target: /models/model.gguf
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    networks:
      - app_net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    environment:
      - LLM_ENABLED=true
      - LLAMA_URL=http://llama:8080
      - LLM_MIN_CONFIDENCE=${LLM_MIN_CONFIDENCE:-0.85}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-8.0}
      - LLM_HEALTH_TIMEOUT_SECONDS=${LLM_HEALTH_TIMEOUT_SECONDS:-1.0}
    depends_on:
      llama:
        condition: service_started
