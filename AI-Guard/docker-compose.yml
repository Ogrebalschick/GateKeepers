services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    # volumes:
    #   - ./backend:/app     # ← ТОЛЬКО для разработки (hot-reload)
    env_file:
      - .env
    environment:
      - DB_HOST=database
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=change_me_in_production
      - JWT_EXPIRATION=86400
      - ADMIN_PASSWORD=demo_admin_2026
      - SRE_PASSWORD=demo_sre_2026
      - DEV_PASSWORD=demo_dev_2026
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # ⚠️ эти два монтирования требуют реальных файлов на хосте:
    # volumes:
      # - ./model/model.gguf:/app/model.gguf:ro
      # - ./model/llama.cpp:/app/llama.cpp:ro
    # environment:
      # - MODEL_PATH=/app/model.gguf
      # - LLAMA_CPP_PATH=/app/llama.cpp
    environment:
      - BACKEND_URL=http://backend:8081
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  database:
    image: mariadb:11.4
    container_name: mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  mariadb_data:
