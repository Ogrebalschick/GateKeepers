services:
  backend:
    build:
      context: ./backend
      dockerfile: ../backend.Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - DATABASE_URL=mariadb+pymysql://${DB_USER}:${DB_PASSWORD}@database:3306/${DB_NAME}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net

  frontend:
    build:
        context: ./frontend
        dockerfile: ../frontend.Dockerfile
    ports:
        - "80:80"
        - "443:443"
    depends_on:
        - backend
        - ml-service
    volumes:
        - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
        - app_net

  ml-service:
    build:
      context: ./ml-service
      dockerfile: ../ml.Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - app_net

  database:
    image: mariadb:11.4
    container_name: mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - app_net


volumes:
  mariadb_data:

networks:
  app_net:
    driver: bridge
