services:
  backend:
    build:
      context: ./backend
      dockerfile: ../backend.Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - DB_HOST=database
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=change_me_in_production
      - JWT_EXPIRATION=86400
      - ADMIN_PASSWORD=demo_admin_2026
      - SRE_PASSWORD=demo_sre_2026
      - DEV_PASSWORD=demo_dev_2026
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app_net

  frontend:
    build:
        context: ./frontend
        dockerfile: ../frontend.Dockerfile
    ports:
        - "80:80"
        - "443:443"
    depends_on:
        - backend
        - ml-service
    volumes:
        - /etc/letsencrypt/live:/etc/letsencrypt/live:ro
        - /etc/letsencrypt/archive:/etc/letsencrypt/archive:ro
    restart: unless-stopped
    networks:
        - app_net
    environment:
      - NGINX_HOST=hackaton.cloudybooks.ru
      - NGINX_PORT=44

  ml-service:
    build:
      context: ./ml-service
      dockerfile: ../ml.Dockerfile
    ports:
      - "8000:8000"
    # volumes:
    #   - ./model/model.gguf:/app/models/guard_model.gguf:ro
    #   - /lingames/llama.cpp/build/bin:/app/llama.cpp:ro
    environment:
      - BACKEND_URL=http://backend:8081
      - LLM_ENABLED=true
      - LLAMA_URL=http://ml-service:8080
      - LLAMA_ENABLED=true
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - app_net

  llama:
    build:
      context: ./llama
      dockerfile: ../llama.Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - /lingames/llama.cpp/build/bin:/app/llama.cpp:ro
    environment:
      - MODEL_PATH=/app/llama.cpp/ggml-model-q4_0.gguf
    depends_on:
      ml-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - app_net

  database:
    image: mariadb:11.4
    container_name: mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - app_net

volumes:
  mariadb_data:

networks:
  app_net:
    driver: bridge
