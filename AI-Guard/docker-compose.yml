services:
  backend:
    build:
      context: ./backend
      dockerfile: ../backend.Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - DB_HOST=database
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=change_me_in_production
      - JWT_EXPIRATION=86400
      - ADMIN_PASSWORD=demo_admin_2026
      - SRE_PASSWORD=demo_sre_2026
      - DEV_PASSWORD=demo_dev_2026
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app_net

  frontend:
    build:
        context: ./frontend
        dockerfile: ../frontend.Dockerfile
    ports:
        - "80:80"
        - "443:443"
    depends_on:
        - backend
        - ml-service
    volumes:
        - /etc/letsencrypt/live:/etc/letsencrypt/live:ro
        - /etc/letsencrypt/archive:/etc/letsencrypt/archive:ro
    restart: unless-stopped
    networks:
        - app_net
    environment:
      - NGINX_HOST=hackaton.cloudybooks.ru
      - NGINX_PORT=44

  ml-service:
    build:
      context: ./ml-service
      dockerfile: ../ml.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - BACKEND_URL=http://backend:8081
      - LLAMA_URL=${LLAMA_URL:-http://host.docker.internal:8080}
      - LLM_MIN_CONFIDENCE=${LLM_MIN_CONFIDENCE:-0.85}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-8.0}
      - LLM_HEALTH_TIMEOUT_SECONDS=${LLM_HEALTH_TIMEOUT_SECONDS:-1.0}
      - LLM_ENABLED=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - app_net

  # llama:
  #   image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
