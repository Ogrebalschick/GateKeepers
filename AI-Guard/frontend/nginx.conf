server {
    listen 80;
    server_name localhost;

    # Runtime DNS: isolated `docker run` has no ml-service/backend yet.
    # A static proxy_pass would refuse to start (host not found in upstream).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # ML-сервис
    location /v1/ {
        set $ml_upstream http://ml-service:8000;
        proxy_pass $ml_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Backend API
    location /api/ {
        set $backend_upstream http://backend:8081;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /auth/ {
        set $auth_upstream http://backend:8081;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
